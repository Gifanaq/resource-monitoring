name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install
      - run: make lint
      - run: poetry run ruff format --check .
      - run: make typecheck
      - run: make test
