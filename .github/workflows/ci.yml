name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tpumon_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d tpumon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SERVICES: "[]"
      TPUMON_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/tpumon_test
    steps:
      - uses: actions/checkout@v5
      - run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install
      - run: make lint
      - run: poetry run ruff format --check .
      - run: make typecheck
      - run: make test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build .
