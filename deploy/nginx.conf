server {
    listen 80 default_server;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(health|services|docs|openapi\.json)$ {
        limit_except GET {
            deny all;
        }

        set $tpumon_upstream api:8000;
        proxy_pass http://$tpumon_upstream;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
