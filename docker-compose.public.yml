services:
  api:
    ports: !reset []
  proxy:
    image: nginx:1.30.7-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - target: 80
        published: "${TPUMON_HTTP_PORT:-80}"
        host_ip: "${TPUMON_HTTP_BIND:-127.0.0.1}"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
