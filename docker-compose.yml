services:
  api:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-tpumon}
      APP_ENV: prod
      CHECK_INTERVAL_SEC: ${CHECK_INTERVAL_SEC:-60}
      SERVICES: "${SERVICES:-[]}"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
