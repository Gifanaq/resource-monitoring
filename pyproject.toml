[project]
name = "tpumon"
version = "0.1.0"
description = "Мониторинг работоспособности ресурсов ТПУ"
authors = [{ name = "Максим Герасимов" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
httpx = ">=0.28"
ruff = ">=0.16"
mypy = ">=2.4"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "B008", "D", "CPY001", "TRY003", "EM101"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "PLR2004",
    "S101",
    "SLF001",
    "PT006",
    "PT011",
]
"conftest.py" = ["ANN", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^tests/", '^conftest\.py$']
